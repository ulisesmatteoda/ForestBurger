version: "2"
sql:
  - engine: "postgresql"
    queries:
      - "db/queries.sql"
      - "db/queries/admin.sql"
      - "db/queries/extra.sql"
      - "db/queries/ajustes.sql"
      - "db/queries/pedidos.sql"
    schema: "db/schema.sql"    
    gen:
      go:
        package: "db"
        out: "db/sqlc/"
        emit_json_tags: true